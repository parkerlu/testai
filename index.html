<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Flappy Bird</title>
    <style>
        body { margin: 0; overflow: hidden; background: #70c5ce; font-family: sans-serif; }
        canvas { display: block; margin: auto; background: #70c5ce; }
        #score { position: absolute; top: 10px; left: 10px; color: white; font-size: 24px; }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="score">0</div>
    <div id="message">Click or press Space to start</div>
    <canvas id="game" width="320" height="480"></canvas>
    <script src="flappy.js"></script>
</body>
</html>
