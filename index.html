<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金色奢华欢迎动画</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha512-6gj0xZdPmfY0lvgcGtOC43A05aL3KMpVN2oOOekq6lTYT0aORmgHt7QVeyXKaqSYfIz4rSxzd9KyNvIBX8s5bA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    :root {
      --gold-1: #f7e7c6;
      --gold-2: #d3a84f;
      --gold-3: #c08d2d;
      --bg-dark: #0a0602;
      --text-main: #fdf7e3;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 20% 20%, rgba(211, 168, 79, 0.18), transparent 45%),
                  radial-gradient(circle at 80% 10%, rgba(247, 231, 198, 0.12), transparent 40%),
                  linear-gradient(120deg, rgba(192, 141, 45, 0.25), rgba(10, 6, 2, 0.9) 45%, rgba(247, 231, 198, 0.25));
      font-family: 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;
      color: var(--text-main);
    }

    canvas#gold-particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .welcome-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, rgba(255, 231, 191, 0.12), rgba(0, 0, 0, 0.85) 65%);
      backdrop-filter: blur(6px);
      z-index: 2;
      opacity: 0;
      visibility: hidden;
    }

    .welcome-card {
      position: relative;
      width: min(760px, 80vw);
      padding: 48px 56px;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(32, 24, 12, 0.9), rgba(18, 12, 6, 0.9));
      border: 1px solid rgba(247, 231, 198, 0.4);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      overflow: hidden;
    }

    .welcome-card::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(247, 231, 198, 0.12), rgba(192, 141, 45, 0.04));
      pointer-events: none;
      filter: blur(0.2px);
    }

    .glow-sweep {
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0));
      transform: translateX(-120%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .content {
      position: relative;
      display: flex;
      gap: 32px;
      align-items: center;
      z-index: 2;
    }

    .avatar-shell {
      position: relative;
      width: 180px;
      height: 180px;
      flex: none;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(247, 231, 198, 0.25), rgba(192, 141, 45, 0.05));
      border: 1px solid rgba(247, 231, 198, 0.35);
      box-shadow: 0 0 25px rgba(192, 141, 45, 0.45), 0 12px 45px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .avatar-shell img {
      width: 94%;
      height: 94%;
      border-radius: 50%;
      object-fit: cover;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.35));
    }

    .avatar-glare {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.32), transparent 40%);
      mix-blend-mode: screen;
      pointer-events: none;
      opacity: 0.6;
    }

    .text-area {
      display: grid;
      gap: 14px;
      color: var(--text-main);
    }

    .label {
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 13px;
      color: rgba(247, 231, 198, 0.75);
      font-weight: 600;
    }

    #welcome-name {
      font-family: 'Cinzel', 'Noto Sans SC', serif;
      font-size: clamp(34px, 4vw, 48px);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 12px 36px rgba(0, 0, 0, 0.55), 0 0 22px rgba(247, 231, 198, 0.45);
      color: #ffe7bf;
    }

    #welcome-company {
      font-size: clamp(18px, 2.3vw, 22px);
      font-weight: 500;
      color: rgba(247, 231, 198, 0.9);
      line-height: 1.5;
    }

    .footer-hint {
      margin-top: 18px;
      font-size: 14px;
      color: rgba(247, 231, 198, 0.65);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <canvas id="gold-particles"></canvas>

  <div id="welcome-overlay" class="welcome-overlay">
    <div class="welcome-card">
      <div class="glow-sweep" id="glow-sweep"></div>
      <div class="content">
        <div class="avatar-shell" id="avatar-shell">
          <img id="welcome-avatar" src="https://images.unsplash.com/photo-1502685104226-ee32379fefbe?auto=format&fit=crop&w=400&q=80" alt="avatar">
          <div class="avatar-glare"></div>
        </div>
        <div class="text-area">
          <div class="label">Welcome Guest</div>
          <div id="welcome-name">尊贵来宾</div>
          <div id="welcome-company">金耀会展中心 · 贵宾签到</div>
          <div class="footer-hint">金光熠熠 · 荣耀启程</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===================== JS Part A: Canvas Particle System =====================
    const canvas = document.getElementById('gold-particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createParticles(count = 120) {
      particles = new Array(count).fill(0).map(() => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 3 + 1,
        speedY: Math.random() * 0.8 + 0.3,
        speedX: (Math.random() - 0.5) * 0.3,
        opacity: Math.random() * 0.6 + 0.25,
        shine: Math.random() * 0.6 + 0.4
      }));
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath();
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
        gradient.addColorStop(0, `rgba(255, 227, 170, ${p.opacity})`);
        gradient.addColorStop(1, `rgba(192, 141, 45, 0)`);
        ctx.fillStyle = gradient;
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function updateParticles() {
      particles.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y > canvas.height + 10) {
          p.y = -10;
          p.x = Math.random() * canvas.width;
        }
        if (p.x > canvas.width + 10) p.x = -10;
        if (p.x < -10) p.x = canvas.width + 10;
      });
    }

    function tick() {
      updateParticles();
      drawParticles();
      requestAnimationFrame(tick);
    }

    createParticles();
    tick();

    // ===================== JS Part B: GSAP Timeline =====================
    const overlay = document.getElementById('welcome-overlay');
    const avatarShell = document.getElementById('avatar-shell');
    const glowSweep = document.getElementById('glow-sweep');
    const nameNode = document.getElementById('welcome-name');
    const companyNode = document.getElementById('welcome-company');

    const welcomeTimeline = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

    welcomeTimeline
      .set(overlay, { autoAlpha: 0, display: 'flex' })
      .set([avatarShell, nameNode, companyNode], { clearProps: 'filter' })
      .to(overlay, { duration: 0.8, autoAlpha: 1, ease: 'power2.out' })
      .fromTo(avatarShell, { scale: 0.3, opacity: 0, filter: 'blur(6px)' }, { duration: 1.1, scale: 1, opacity: 1, filter: 'blur(0px)', ease: 'expo.out' }, 0)
      .fromTo(glowSweep, { xPercent: -120 }, { duration: 1.2, xPercent: 140, ease: 'power2.out' }, 0.15)
      .fromTo(nameNode, { y: 80, opacity: 0 }, { duration: 0.9, y: 0, opacity: 1 }, 0.3)
      .fromTo(companyNode, { y: 20, opacity: 0 }, { duration: 0.8, y: 0, opacity: 1 }, '-=0.35')
      .to(avatarShell, { duration: 1.2, boxShadow: '0 0 40px rgba(247,231,198,0.4), 0 0 80px rgba(192,141,45,0.35)' }, '-=0.6')
      .to({}, { duration: 4 })
      .to(overlay, { duration: 0.8, autoAlpha: 0, ease: 'power2.inOut' })
      .set(overlay, { display: 'none' });

    // ===================== JS Part C: Trigger Function =====================
    function playWelcomeAnimation(options = {}) {
      const {
        name = '尊贵来宾',
        company = '金耀会展中心 · 贵宾签到',
        avatar = 'https://images.unsplash.com/photo-1502685104226-ee32379fefbe?auto=format&fit=crop&w=400&q=80'
      } = options;

      nameNode.textContent = name;
      companyNode.textContent = company;
      const avatarImg = document.getElementById('welcome-avatar');
      avatarImg.src = avatar;

      welcomeTimeline.restart();
    }

    // Demo: auto-play once after page load
    window.addEventListener('load', () => {
      playWelcomeAnimation({
        name: '贵宾 · 张云霄',
        company: '璀璨之夜 · 金色盛典'
      });
    });
  </script>
</body>
</html>
